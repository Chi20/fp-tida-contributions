name: Validate contribution source

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m sphinx -W --keep-going -b html src/doc target/html
      - uses: actions/upload-artifact@v4
        with:
          name: contribution-html
          path: target/html
